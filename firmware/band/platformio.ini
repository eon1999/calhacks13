; Cadence wristband. Two builds of the same firmware:
;   band      real sensors (MPU6050 motion + MAX30102 pulse on I2C)
;   band-sim  a bare ESP32 dev board, no sensors: made-up motion and pulse,
;             driven from the serial monitor (w walk, f fall, s SOS, o off wrist)
; The logic in lib/cadence_core is tested on a PC: `npm run firmware:test`.

[platformio]
default_envs = band-sim

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall

[env:band]
build_src_filter = +<*> -<sensors/sim.cpp>
lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2

[env:band-sim]
build_src_filter = +<*> -<sensors/mpu6050.cpp> -<sensors/max30102.cpp>
build_flags =
  ${env.build_flags}
  -DCADENCE_SIM
  ; Post a window every minute so you see data quickly.
  -DCADENCE_WINDOW_MS=60000
